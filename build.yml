name: Build TUXIRO REPEAT (VST3)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect VST3
        run: |
          mkdir -p dist
          bundle="$(find build -type d -name '*.vst3' | head -n 1)"
          echo "Bundle: $bundle"
          cp -R "$bundle" dist/

      - name: Ad-hoc sign (macOS)
        if: matrix.os == 'macos-latest'
        run: codesign --force --deep -s - "dist/TUXIRO REPEAT.vst3"

      - name: Zip (Windows)
        if: matrix.os == 'windows-latest'
        run: cd dist && 7z a ../TUXIRO_REPEAT-windows-vst3.zip "TUXIRO REPEAT.vst3"

      - name: Zip (macOS)
        if: matrix.os == 'macos-latest'
        run: cd dist && ditto -c -k --keepParent "TUXIRO REPEAT.vst3" ../TUXIRO_REPEAT-macos-vst3.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TUXIRO_REPEAT-${{ matrix.name }}-vst3
          path: TUXIRO_REPEAT-${{ matrix.name }}-vst3.zip

      - name: Attach to GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TUXIRO_REPEAT-${{ matrix.name }}-vst3.zip
